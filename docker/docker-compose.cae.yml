services:
  # Federated Learning Server for CAE
  fl-server-cae:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cae
    container_name: fl-server-cae
    environment:
      - FL_ROLE=server
      - FL_SERVER_HOST=0.0.0.0
      - FL_SERVER_PORT=5544
      - FL_NUM_CLIENTS=3
      - FL_MIN_CLIENTS=2
      - FL_AGGREGATION=fedavg
      - FL_CLIENT_STAGGER_SEC=10
    ports:
      - "5544:5544"
    networks:
      - fl-cae-network
    volumes:
      - ../fl-payload/checkpoints:/app/checkpoints
      - ../fl-payload/plots:/app/plots
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 5544)); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 15s

  # Client 1
  fl-client-cae-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cae
    container_name: fl-client-cae-1
    environment:
      - FL_ROLE=client
      - FL_CLIENT_ID=client_1
      - FL_SERVER_URL=http://fl-server-cae:5544
      - FL_CLEAN_DIR=/app/data/payload/images/clean
      - FL_NOISY_DIR=/app/data/payload/images/noise
      - FL_NUM_ROUNDS=10
      - FL_LEARNING_RATE=0.001
      - FL_BATCH_SIZE=32
      - FL_EPOCHS_PER_ROUND=1
    depends_on:
      fl-server-cae:
        condition: service_healthy
    networks:
      - fl-cae-network
    volumes:
      - ../data/payload/images/clean:/app/data/payload/images/clean:ro
      - ../data/payload/images/noise:/app/data/payload/images/noise:ro

  # Client 2
  fl-client-cae-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cae
    container_name: fl-client-cae-2
    environment:
      - FL_ROLE=client
      - FL_CLIENT_ID=client_2
      - FL_SERVER_URL=http://fl-server-cae:5544
      - FL_CLEAN_DIR=/app/data/payload/images/clean
      - FL_NOISY_DIR=/app/data/payload/images/noise
      - FL_NUM_ROUNDS=10
      - FL_LEARNING_RATE=0.001
      - FL_BATCH_SIZE=32
      - FL_EPOCHS_PER_ROUND=1
    depends_on:
      fl-server-cae:
        condition: service_healthy
    networks:
      - fl-cae-network
    volumes:
      - ../data/payload/images/clean:/app/data/payload/images/clean:ro
      - ../data/payload/images/noise:/app/data/payload/images/noise:ro

  # Client 3
  fl-client-cae-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cae
    container_name: fl-client-cae-3
    environment:
      - FL_ROLE=client
      - FL_CLIENT_ID=client_3
      - FL_SERVER_URL=http://fl-server-cae:5544
      - FL_CLEAN_DIR=/app/data/payload/images/clean
      - FL_NOISY_DIR=/app/data/payload/images/noise
      - FL_NUM_ROUNDS=10
      - FL_LEARNING_RATE=0.001
      - FL_BATCH_SIZE=32
      - FL_EPOCHS_PER_ROUND=1
    depends_on:
      fl-server-cae:
        condition: service_healthy
    networks:
      - fl-cae-network
    volumes:
      - ../data/payload/images/clean:/app/data/payload/images/clean:ro
      - ../data/payload/images/noise:/app/data/payload/images/noise:ro

networks:
  fl-cae-network:
    driver: bridge
